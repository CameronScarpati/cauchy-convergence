<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cauchy Convergence: an interactive Cauchy distribution demo</title>
    <meta
      name="description"
      content="An interactive demonstration of why the running mean of Cauchy samples never converges while the running median does. Seeded simulations, live chart, and the mathematics."
    />
    <meta name="author" content="Cameron Scarpati" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://cauchy-convergence.netlify.app/" />
    <meta name="theme-color" content="#F6F7F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
    <script>
      /* Set the theme before first paint; src/theme/theme.ts owns this logic for
         the app lifetime and its THEME_KEY must match the storage key here. */
      try {
        var theme = localStorage.getItem('cauchy-theme')
        if (theme !== 'dark' && theme !== 'light')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (error) {
        /* Storage denied: the stylesheet default paints and initTheme() retries. */
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cauchy Convergence" />
    <meta property="og:url" content="https://cauchy-convergence.netlify.app/" />
    <meta property="og:title" content="Cauchy Convergence: an interactive Cauchy distribution demo" />
    <meta
      property="og:description"
      content="Watch the running mean of Cauchy samples refuse to settle while the running median locks on. Seeded simulations with the mathematics beside a live chart."
    />
    <meta property="og:image" content="https://cauchy-convergence.netlify.app/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Cauchy Convergence demo: two extreme draws near sample 580 drag the running mean down to about -12, and thousands of samples later it has still not returned to the location line the median holds."
    />

  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Cauchy Convergence is an interactive statistics demonstration that needs JavaScript.
        It streams seeded samples from a Cauchy or Normal distribution and animates the
        running mean and running median: the Cauchy mean never converges because the Law of
        Large Numbers does not apply to it, while the median locks onto the location
        parameter. Source and explanation:
        <a href="https://github.com/CameronScarpati/cauchy-convergence">
          github.com/CameronScarpati/cauchy-convergence</a
        >.
      </p>
